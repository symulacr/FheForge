---
# Alert Rules for FheForge
# MC-061: Removed 11 rules referencing non-existent metrics.
# MC-062: Restored 4 API rules confirmed functional via /metrics endpoint.

groups:
  # ── API alerts (require /metrics endpoint on backend) ──────────────
  - name: api_alerts
    interval: 30s
    rules:
      # High Error Rate (>5% requests 5xx over 5m)
      - alert: HighErrorRate
        expr: |
          (
            rate(http_requests_total{status=~"5.."}[5m]) /
            rate(http_requests_total[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: backend-api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"

      # Slow API Response (p95 > 1s over 5m)
      - alert: SlowAPIResponse
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 1
        for: 5m
        labels:
          severity: warning
          service: backend-api
        annotations:
          summary: "Slow API response time"
          description: "95th percentile response time is {{ $value }}s"

      # API Down (target unreachable >1m)
      - alert: APIDown
        expr: up{job="backend-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: backend-api
        annotations:
          summary: "API is down"
          description: "Backend API has been down for more than 1 minute"

      # New User Sign-up (informational)
      - alert: NewUserSignup
        expr: increase(user_signups_total[5m]) > 0
        labels:
          severity: info
          service: business
        annotations:
          summary: "New user sign-up"
          description: "{{ $value }} new user(s) signed up in the last 5 minutes"
