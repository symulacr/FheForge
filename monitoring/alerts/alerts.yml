# Alert Rules for FheForge

groups:
  - name: api_alerts
    interval: 30s
    rules:
      # High Error Rate
      - alert: HighErrorRate
        expr: |
          (
            rate(http_requests_total{status=~"5.."}[5m]) /
            rate(http_requests_total[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: backend-api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"

      # Slow API Response
      - alert: SlowAPIResponse
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 1
        for: 5m
        labels:
          severity: warning
          service: backend-api
        annotations:
          summary: "Slow API response time"
          description: "95th percentile response time is {{ $value }}s"

      # API Down
      - alert: APIDown
        expr: up{job="backend-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: backend-api
        annotations:
          summary: "API is down"
          description: "Backend API has been down for more than 1 minute"

  - name: database_alerts
    interval: 30s
    rules:
      # Database Connection Failed
      - alert: DatabaseConnectionFailed
        expr: up{job="database"} == 0
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "Database connection failed"
          description: "Cannot connect to database for more than 1 minute"

      # Slow Database Queries
      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95,
            rate(database_query_duration_seconds_bucket[5m])
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "Slow database queries"
          description: "95th percentile query time is {{ $value }}s"

      # High Database Connections
      - alert: HighDatabaseConnections
        expr: database_connections_active > 80
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "High database connections"
          description: "Active database connections: {{ $value }}"

  - name: contract_alerts
    interval: 60s
    rules:
      # Contract Deployment Failed
      - alert: ContractDeploymentFailed
        expr: contract_deployment_total{status="failed"} > 0
        for: 1m
        labels:
          severity: critical
          service: contracts
        annotations:
          summary: "Contract deployment failed"
          description: "Contract deployment failed {{ $value }} times"

      # High Gas Price
      - alert: HighGasPrice
        expr: gas_price_gwei > 100
        for: 5m
        labels:
          severity: warning
          service: contracts
        annotations:
          summary: "High gas price"
          description: "Gas price is {{ $value }} gwei"

      # Contract Interaction Failed
      - alert: ContractInteractionFailed
        expr: |
          (
            rate(contract_interaction_total{status="failed"}[5m]) /
            rate(contract_interaction_total[5m])
          ) > 0.1
        for: 5m
        labels:
          severity: critical
          service: contracts
        annotations:
          summary: "High contract interaction failure rate"
          description: "Contract interaction failure rate is {{ $value | humanizePercentage }}"

  - name: system_alerts
    interval: 30s
    rules:
      # High CPU Usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}"

      # High Disk Usage
      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes{fstype!="tmpfs"} - node_filesystem_free_bytes{fstype!="tmpfs"}) / node_filesystem_size_bytes{fstype!="tmpfs"} * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High disk usage"
          description: "Disk usage is {{ $value }}% on {{ $labels.instance }}"

  - name: business_alerts
    interval: 60s
    rules:
      # New User Sign-up
      - alert: NewUserSignup
        expr: increase(user_signups_total[5m]) > 0
        labels:
          severity: info
          service: business
        annotations:
          summary: "New user sign-up"
          description: "{{ $value }} new user(s) signed up in the last 5 minutes"

      # High Transaction Volume
      - alert: HighTransactionVolume
        expr: rate(contract_interaction_total[5m]) > 10
        for: 5m
        labels:
          severity: info
          service: business
        annotations:
          summary: "High transaction volume"
          description: "Transaction rate is {{ $value }} transactions/second"
