[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test-foundry"
solc_version = "0.8.34"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@fhenixprotocol/=node_modules/@fhenixprotocol/",
    "@cofhe/mock-contracts/=node_modules/@cofhe/mock-contracts/contracts/",
    "@pythnetwork/pyth-sdk-solidity/=node_modules/@pythnetwork/pyth-sdk-solidity/",
    "hardhat/=hardhat/",
    "forge-std/=lib/forge-std/src/",
]

# Coverage configuration (MC-076)
[profile.coverage]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test-foundry"
solc_version = "0.8.34"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@fhenixprotocol/=node_modules/@fhenixprotocol/",
    "@cofhe/mock-contracts/=node_modules/@cofhe/mock-contracts/contracts/",
    "@pythnetwork/pyth-sdk-solidity/=node_modules/@pythnetwork/pyth-sdk-solidity/",
    "hardhat/=hardhat/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 64
depth = 16
fail_on_revert = false
