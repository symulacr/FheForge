# Promtail Configuration for FheForge

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Backend Application Logs
  - job_name: backend-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend-api
          env: production
          service: fheforge

    pipeline_stages:
      - json:
          expressions:
            timestamp: time
            level: level
            context: context
            message: message
            data: data

      - labels:
          level:
          context:

      - timestamp:
          source: timestamp
          format: RFC3339

  # Frontend Application Logs
  - job_name: frontend-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: frontend
          env: production
          service: ui

    pipeline_stages:
      - json:
          expressions:
            timestamp: time
            level: level
            message: message
            url: url

      - labels:
          level:

      - timestamp:
          source: timestamp
          format: RFC3339

  # System Logs
  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          env: production

    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\w+ \d+ \d+:\d+:\d+) (?P<host>\S+) (?P<process>\S+)(?:\[(?P<pid>\d+)\])?: (?P<message>.*)$'

      - labels:
          host:
          process:

      - timestamp:
          source: timestamp
          format: "Jan 2 15:04:05"
          location: UTC

  # Docker Container Logs
  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container

      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream

      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service

    pipeline_stages:
      - json:
          expressions:
            timestamp: time
            level: level
            message: message

      - labels:
          level:
          service:

      - timestamp:
          source: timestamp
          format: RFC3339

  # Contract Interaction Logs
  - job_name: contract-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: contracts
          env: production
          service: blockchain

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            contract: contract
            method: method
            message: message

      - labels:
          level:
          contract:
          method:

      - timestamp:
          source: timestamp
          format: RFC3339

  # Error Logs Only
  - job_name: error-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: errors
          env: production

    pipeline_stages:
      - json:
          expressions:
            timestamp: time
            level: level
            context: context
            message: message

      - regex:
          expression: "(?P<level>error|ERROR|Error)"

      - labels:
          level:
          context:

      - timestamp:
          source: timestamp
          format: RFC3339
