<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FheForge — Interactive Protocol Simulator v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#010202;color:#fff;font-family:'Courier New',monospace;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 380px;height:100vh}
#viewport{position:relative;overflow:hidden}
#sidebar{background:#14161a;border-left:1px solid #44484d;overflow-y:auto;display:flex;flex-direction:column}
  #sidebar h2{padding:12px 14px 8px;font-size:11px;color:#2981fb;border-bottom:1px solid #44484d;letter-spacing:1px}
#strategy-list{padding:8px}
#strategy-list .item{padding:10px 12px;margin:3px 0;border:1px solid #44484d;cursor:pointer;font-size:10px;transition:all .15s}
  #strategy-list .item:hover{border-color:#6ba5fb;transform:translateX(2px)}
  #strategy-list .item.active{border-color:#6ba5fb;background:rgba(107,165,251,0.1);box-shadow:0 0 8px rgba(107,165,251,0.2)}
#strategy-list .item .name{color:#fff;font-weight:bold;font-size:11px}
#strategy-list .item .desc{color:#bbbec3;font-size:10px;margin-top:2px}
#strategy-list .item .meta{color:#9b9fa5;font-size:9px;margin-top:2px}
#controls-bar{display:flex;gap:6px;padding:8px 14px;border-top:1px solid #44484d;border-bottom:1px solid #44484d;align-items:center;flex-wrap:wrap}
  #controls-bar button{background:transparent;color:#2981fb;border:1px solid #2981fb;padding:5px 12px;font-family:inherit;font-size:10px;cursor:pointer}
  #controls-bar button:hover{background:#6ba5fb;color:#010202}
#controls-bar button:disabled{opacity:.5}
#controls-bar .status{font-size:10px;color:#bbbec3;margin-left:auto}
#controls-bar .status .live{color:#22c55e}
#phase-bar{padding:8px 14px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #44484d}
.phase-chip{padding:3px 10px;font-size:10px;border:1px solid #44484d;background:transparent;color:#bbbec3;cursor:pointer}
.phase-chip.done{color:#22c55e;border-color:#22c55e}
  .phase-chip.active{color:#6ba5fb;border-color:#6ba5fb;background:rgba(107,165,251,0.1)}
.phase-chip.pending{color:#bbbec3}
#detail-panel{flex:1;overflow-y:auto;padding:10px 14px;display:none}
  #detail-panel .title{font-size:11px;color:#2981fb;margin-bottom:6px}
#detail-panel .row{display:flex;justify-content:space-between;padding:3px 0;font-size:9px;border-bottom:1px solid #2b2e33}
#detail-panel .row .label{color:#bbbec3}
#detail-panel .row .value{color:#fff}
#detail-panel .fhe-ops{margin-top:8px}
#detail-panel .fhe-ops .op{background:#2b2e33;padding:4px 8px;margin:2px 0;font-size:9px;color:#f59e0b;border-left:2px solid #f59e0b}
#detail-panel .fhe-ops .op .gas{color:#bbbec3;font-size:8px;margin-left:8px}
#canvas2d{width:100%;height:200px;border-top:1px solid #44484d;cursor:pointer}
#canvas2d-container{position:relative}
#canvas2d-container .label{position:absolute;top:4px;left:8px;font-size:8px;color:#bbbec3;z-index:2}
#view-switch{position:absolute;top:12px;right:12px;z-index:10;display:flex;gap:4px}
#view-switch button{background:transparent;color:#bbbec3;border:1px solid #44484d;padding:4px 10px;font-family:inherit;font-size:9px;cursor:pointer}
  #view-switch button.active{color:#6ba5fb;border-color:#6ba5fb}
#enc-indicator{position:absolute;top:12px;left:12px;z-index:10;font-size:9px;color:#f59e0b;background:rgba(1,2,2,0.85);padding:4px 10px;border:1px solid #f59e0b}
@media(max-width:900px){
  #app{grid-template-columns:1fr;height:100dvh}
  #sidebar{position:fixed;bottom:0;left:0;right:0;height:55%;border-left:none;border-top:1px solid #44484d;z-index:20;overflow-y:auto;border-radius:0}
  #viewport{height:45dvh}
  #strategy-list{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:8px}
  #strategy-list .item{flex:0 0 200px;white-space:nowrap}
  #controls-bar{flex-wrap:wrap}
  #phase-bar{overflow-x:auto;flex-wrap:nowrap}
  #enc-indicator{font-size:7px;padding:2px 6px}
  #view-switch{top:8px;right:8px}
  #view-switch button{font-size:7px;padding:2px 6px}
  #info{display:none}
}
#progress-bar{height:2px;background:#2b2e33;margin:0 14px;position:relative}
  #progress-fill{height:100%;background:#2981fb;width:0%;transition:width .3s}
  *:focus-visible{outline:2px solid #2981fb;outline-offset:2px}
  button:focus-visible, .item:focus-visible{border-color:#2981fb!important}
#controls-legend{font-size:8px;color:#9b9fa5;padding:6px 0 2px;width:100%;white-space:nowrap;overflow-x:auto;border-top:1px solid #2b2e33;margin-top:4px}
[data-tt]{position:relative;cursor:help;border-bottom:1px dashed #bbbec3}
  [data-tt]:hover:after{content:attr(data-tt);position:absolute;bottom:100%;left:0;background:#2b2e33;color:#fff;padding:4px 8px;font-size:9px;white-space:nowrap;border:1px solid #2981fb;z-index:100;pointer-events:none}
.done-mark{margin-left:4px;font-style:normal;font-size:11px}
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="enc-indicator" data-tt="All data encrypted via FHE — ciphertext never decrypted on-chain">🔒 All Encrypted</div>
    <div id="view-switch"><button id="view3d-btn" class="active" aria-label="3D view">3D</button><button id="view2d-btn" aria-label="2D view">2D</button></div>
  </div>
  <div id="sidebar">
    <h2>⚡ Strategy Simulator</h2>
    <div id="strategy-list"></div>
    <div id="phase-bar"></div>
    <div id="controls-bar">
      <button id="back-btn" aria-label="Previous step" disabled>◀</button>
      <button id="play-btn" aria-label="Play/Pause simulation" aria-pressed="false">▶ Simulate</button>
      <button id="reset-btn" aria-label="Reset simulation" disabled>⟲ Reset</button>
      <input type="range" id="speed-slider" min="0.5" max="3" step="0.5" value="1" style="width:50px;background:#2b2e33;accent-color:#2981fb;height:4px" aria-label="Simulation speed">
      <span style="font-size:8px;color:#7d8086;min-width:30px" id="speed-label">1×</span>
      <button id="reveal-btn" aria-label="Toggle details">🔍 Show Details</button>
      <span class="status" id="sim-status" aria-live="polite">Select a strategy to simulate</span>
      <div id="controls-legend">⛓ FHE=Fully Homomorphic Encryption • APY=Annual Percentage Yield • LTV=Loan-to-Value • TVL=Total Value Locked • euint128=Encrypted uint128</div>
    </div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="detail-panel"></div>
    <div id="canvas2d-container"><div class="label">⏱ Strategy Timeline (2D)</div><canvas id="canvas2d"></canvas></div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import{OrbitControls}from'three/addons/controls/OrbitControls.js';
import{CSS2DRenderer,CSS2DObject}from'three/addons/renderers/CSS2DRenderer.js';

// ──── SETUP ────
let renderer,labelRenderer,controls,camera,scene;
try{
  scene=new THREE.Scene();scene.background=new THREE.Color(0x010202);
  camera=new THREE.PerspectiveCamera(40,document.getElementById('viewport').clientWidth/document.getElementById('viewport').clientHeight,1,200);
  camera.position.set(16,10,16);
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setSize(document.getElementById('viewport').clientWidth,document.getElementById('viewport').clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  document.getElementById('viewport').appendChild(renderer.domElement);
  labelRenderer=new CSS2DRenderer();labelRenderer.setSize(renderer.domElement.width,renderer.domElement.height);
  labelRenderer.domElement.style.position='absolute';labelRenderer.domElement.style.top='0';labelRenderer.domElement.style.pointerEvents='none';
  document.getElementById('viewport').appendChild(labelRenderer.domElement);
  controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.05;
  controls.autoRotate=true;controls.autoRotateSpeed=.6;controls.target.set(0,0,0);controls.maxPolarAngle=Math.PI/2.2;
  controls.addEventListener('start',()=>{if(simState==='idle'){clearTimeout(autoRotateTimer);controls.autoRotate=true}});
  controls.addEventListener('end',()=>{if(simState==='idle'){clearTimeout(autoRotateTimer);autoRotateTimer=setTimeout(()=>{controls.autoRotate=false},8e3)}});
}catch(e){
  const fb=document.createElement('div');
  fb.id='webgl-fallback';
  fb.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;text-align:center;padding:30px;background:#2b2e33;border:1px solid #dc2626;max-width:500px';
  fb.innerHTML='<h2 style="color:#dc2626;font-size:16px;margin-bottom:8px">⚠ 3D View Not Available</h2><p style="color:#bbbec3;font-size:12px;line-height:1.5">Your browser does not support WebGL or the 3D libraries failed to load. Switch to 2D Timeline view below to continue exploring strategies.</p><p style="color:#949497;font-size:11px;margin-top:12px">If you want 3D: try Chrome/Edge with hardware acceleration enabled.</p>';
  document.getElementById('viewport').appendChild(fb);
  // Show 2D canvas
  const c2d=document.getElementById('canvas2d');
  c2d.style.height='400px';
  resize2d();
}

if(scene){
  const al=new THREE.AmbientLight(0x222244,.5);scene.add(al);
  const dl=new THREE.DirectionalLight(0x2981fb,1.2);dl.position.set(10,20,10);scene.add(dl);
  const fl=new THREE.DirectionalLight(0x22c55e,.3);fl.position.set(-10,5,-10);scene.add(fl);
  const gh=new THREE.GridHelper(28,28,0x44484d,0x2b2e33);gh.position.y=-3.5;scene.add(gh);

  // Stars
  const sg=new THREE.BufferGeometry();const sp=new Float32Array(2000*3);
  for(let i=0;i<6000;i++)sp[i]=(Math.random()-.5)*180;
  sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0x2981fb,size:.04,transparent:true,opacity:.25})));
}

// Global error handler for CDN/library load failures
window.addEventListener('error',e=>{
  const fb=document.getElementById('webgl-fallback');
  if(!fb){
    const d=document.createElement('div');d.id='webgl-fallback';
    d.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:999;background:#dc2626;color:#fff;padding:10px 16px;font-size:11px;text-align:center';
    d.textContent='⚠ An error occurred. Try refreshing the page or using Chrome with hardware acceleration.';
    document.body.appendChild(d);
  }
});

// ──── CONTRACTS DATA ────
const C=[
  {id:'FheForgeBase',l:'FheForgeBase',s:'ACL • Auth • SafeMath',c:0x7d8086,p:[0,1.5,0],z:1.1,en:false},
  {id:'LendingPool',l:'LendingPool',s:'Supply • Borrow • Liquidate',c:0x2981fb,p:[-4.5,0,3.5],z:1.0,en:true},
  {id:'StrategyVault',l:'StrategyVault',s:'Encrypted Positions',c:0x22c55e,p:[3.5,0,3.5],z:1.0,en:true},
  {id:'PriceOracle',l:'PriceOracle',s:'Pyth + Fallback',c:0x2981fb,p:[-6,-.5,-1.5],z:.8,en:false},
  {id:'TokenRegistry',l:'TokenRegistry',s:'Token Address Map',c:0x2981fb,p:[-3.5,-1,-3.5],z:.7,en:false},
  {id:'StrategyRegistry',l:'StrategyRegistry',s:'Strategy Meta + TVL',c:0x22c55e,p:[5.5,-.5,.5],z:.85,en:true},
  {id:'FheForgeComposer',l:'Composer',s:'Strategy Orchestrator',c:0xf59e0b,p:[0,-.5,0],z:1.2,en:true},
  {id:'SwapRouter',l:'SwapRouter',s:'Intent + Uniswap V3',c:0xa855f7,p:[4.5,0,-2.5],z:.85,en:false},
  {id:'StrategyExecutor',l:'Exec',s:'8 Action Types',c:0xa855f7,p:[2.5,.5,-4.5],z:.7,en:false},
  {id:'ExecutorContract',l:'ExecContract',s:'Ownable Executor',c:0xa855f7,p:[.5,-1.5,-5],z:.6,en:false},
  {id:'FheForgeToken',l:'Token',s:'ERC20Votes',c:0xef4444,p:[-2,-1.5,5],z:.65,en:false},
  {id:'FheForgeTimelock',l:'Timelock',s:'Delay + Execute',c:0xef4444,p:[0,-2,5.5],z:.65,en:false},
  {id:'FheForgeGovernor',l:'Governor',s:'Voting + Quorum',c:0xef4444,p:[2,-1.5,5],z:.65,en:false},
];

const ext=[
  {l:'CoFHE\nTaskManager',p:[-7,2.5,5.5],c:0x7d8086},{l:'User\nWallet',p:[0,4.5,7],c:0x7d8086},
  {l:'Pyth\nOracle',p:[-8,-.5,-4],c:0x7d8086},{l:'Uniswap V3',p:[7,0,-5],c:0x7d8086},
  {l:'FHESafeMath128',p:[3.5,2.5,5.5],c:0x7d8086},{l:'Gemini AI',p:[-5,3.5,-3],c:0x7d8086},
  {l:'Backend API',p:[-3.5,3.5,-4.5],c:0x7d8086},{l:'WETH9',p:[-1.5,-2.5,3.5],c:0x7d8086},
];

// ──── DRAW ────
const nodes={},meshes=[],coreColors={};
function mkLabel(t,s,cl,sz=1){
  const d=document.createElement('div');d.style.cssText='color:#fff;font-family:\'Courier New\',monospace;text-align:center;pointer-events:none';
  const h=document.createElement('div');h.style.cssText=`font-size:${11*sz}px;font-weight:bold;color:${'#'+cl.toString(16).padStart(6,'0')}`;
  h.textContent=t;d.appendChild(h);
  if(s){const b=document.createElement('div');b.style.cssText=`font-size:${8*sz}px;color:#bbbec3;margin-top:2px`;b.textContent=s;d.appendChild(b)}
  return new CSS2DObject(d);
}

C.forEach(c=>{
  const g=new THREE.Group();g.position.set(c.p[0],c.p[1],c.p[2]);
  const r=new THREE.Mesh(new THREE.RingGeometry(c.z*.85,c.z*1,32),new THREE.MeshBasicMaterial({color:c.c,transparent:true,opacity:.12,side:THREE.DoubleSide}));
  r.rotation.x=-Math.PI/2;r.position.y=-c.z*.45;g.add(r);
  const b=new THREE.Mesh(new THREE.BoxGeometry(c.z*.75,c.z*.35,c.z*.75),new THREE.MeshPhysicalMaterial({color:c.c,metalness:.7,roughness:.25,emissive:c.c,emissiveIntensity:.08,transparent:true,opacity:.9}));
  b.position.y=.15;g.add(b);coreColors[c.id]=c.c;
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(b.geometry),new THREE.LineBasicMaterial({color:c.c,transparent:true,opacity:.25}));
  e.position.y=.15;g.add(e);
  scene.add(g);
  const l=mkLabel(c.l,c.s,c.c,c.z);l.position.set(c.p[0],c.p[1]+c.z*.65,c.p[2]);scene.add(l);
  nodes[c.id]={g,r,b,e,pos:new THREE.Vector3(c.p[0],c.p[1],c.p[2]),color:c.c,data:c};meshes.push(b);
});

ext.forEach(e=>{
  const d=document.createElement('div');d.style.cssText='color:#bbbec3;font-family:\'Courier New\',monospace;text-align:center;font-size:8px;pointer-events:none';d.style.whiteSpace='pre-line';d.textContent=e.l;
  const l=new CSS2DObject(d);l.position.set(e.p[0],e.p[1],e.p[2]);scene.add(l);
  nodes[e.l]={pos:new THREE.Vector3(e.p[0],e.p[1],e.p[2]),color:e.c,isExternal:true};
});

// ──── CONNECTIONS ────
const edges=[
  ['FheForgeBase','LendingPool',0x2981fb,'inherits'],['FheForgeBase','StrategyVault',0x22c55e,'inherits'],
  ['FheForgeBase','FheForgeComposer',0xf59e0b,'inherits'],['FheForgeBase','SwapRouter',0xa855f7,'inherits'],
  ['FheForgeBase','PriceOracle',0x2981fb,'inherits'],['FheForgeBase','TokenRegistry',0x2981fb,'inherits'],
  ['FheForgeBase','StrategyRegistry',0x22c55e,'inherits'],['FheForgeBase','StrategyExecutor',0xa855f7,'inherits'],
  ['LendingPool','PriceOracle',0x2981fb,'oracle'],['StrategyVault','StrategyRegistry',0x22c55e,'TVL'],
  ['Composer','StrategyVault',0xf59e0b,'openPos'],['Composer','LendingPool',0xf59e0b,'deposit/borrow'],
  ['Composer','SwapRouter',0xf59e0b,'swap'],['SwapRouter','ExecutorContract',0xa855f7,'exec'],
  ['Exec','LendingPool',0xa855f7,'actions'],['Token','Governor',0xef4444,'vote'],
  ['Governor','Timelock',0xef4444,'queue'],
  ['CoFHE\nTaskManager','FheForgeBase',0x7d8086,'FHE ops'],['CoFHE\nTaskManager','LendingPool',0x7d8086,'verify'],
  ['CoFHE\nTaskManager','StrategyVault',0x7d8086,'encrypt'],['Pyth\nOracle','PriceOracle',0x7d8086,'price'],
  ['Uniswap V3','SwapRouter',0x7d8086,'DEX'],['User\nWallet','Composer',0x7d8086,'strategies'],
  ['User\nWallet','LendingPool',0x7d8086,'lending'],['User\nWallet','StrategyVault',0x7d8086,'vault'],
  ['FHESafeMath128','FheForgeBase',0x7d8086,'safe math'],['Gemini AI','Composer',0x7d8086,'AI builder'],
  ['Backend API','LendingPool',0x7d8086,'events'],
];
const curves=[];
edges.forEach(e=>{
  const f=nodes[e[0]],t=nodes[e[1]];if(!f||!t)return;
  const s=f.pos.clone(),en=t.pos.clone();const mid=new THREE.Vector3().addVectors(s,en).multiplyScalar(.5);mid.y+=2;
  const pts=[];for(let k=0;k<=1;k+=.02){const p=new THREE.Vector3().lerpVectors(s,en,k);p.y+=Math.sin(k*Math.PI)*2;pts.push(p)}
  const cv=new THREE.CatmullRomCurve3(pts);
  const tube=new THREE.Mesh(new THREE.TubeGeometry(cv,32,.035,8,false),new THREE.MeshPhysicalMaterial({color:e[2],emissive:e[2],emissiveIntensity:.15,transparent:true,opacity:.35}));
  scene.add(tube);curves.push({curve:cv,mesh:tube,color:e[2],from:e[0],to:e[1]});
  if(e[3]){const mp=cv.getPoint(.5);const d=document.createElement('div');d.style.cssText='color:#bbbec3;font-family:\'Courier New\',monospace;font-size:7px;pointer-events:none;background:rgba(1,2,2,.8);padding:1px 4px';d.textContent=e[3];const l2=new CSS2DObject(d);l2.position.copy(mp);l2.position.y+=.5;scene.add(l2)}
});

// ──── STRATEGIES ────
const STRATEGIES={
  supply:{name:'Supply',desc:'Supply USDC to lending pool',risk:'LOW',gas:'190k',apy:'5.2%',
    phases:[
      {name:'Setup',steps:[{node:'User\nWallet',label:'Connect Wallet',fhe:[],gas:'-',en:false},{node:'FheForgeBase',label:'Grant Permit',fhe:['Grant permission'],gas:'45k',en:false}]},
      {name:'Execute',steps:[{node:'LendingPool',label:'Supply (shield)',fhe:['Encrypt amount','Encrypted equality','Conditional select','Overflow check'],gas:'145k',en:true}]},
      {name:'Confirm',steps:[{node:'LendingPool',label:'Confirm Supply',fhe:[],gas:'-',en:false,event:'Confirm deposit on-chain'}]},
    ]},
  borrow:{name:'Borrow 50% LTV',desc:'Supply → Oracle → Borrow',risk:'MODERATE',gas:'355k',apy:'8.5%',
    phases:[
      {name:'Setup',steps:[{node:'User\nWallet',label:'Connect',fhe:[],gas:'-',en:false},{node:'FheForgeBase',label:'Permit',fhe:['Grant permission'],gas:'45k',en:false}]},
      {name:'Supply',steps:[{node:'LendingPool',label:'Supply',fhe:['Encrypt amount','Encrypted equality','Conditional select','Overflow check'],gas:'145k',en:true}]},
      {name:'Borrow',steps:[{node:'PriceOracle',label:'Price Check',fhe:[],gas:'15k',en:false},{node:'LendingPool',label:'Borrow LTV',fhe:['Multiply encrypted','Encrypted comparison','Conditional select'],gas:'210k',en:true}]},
      {name:'Confirm',steps:[{node:'LendingPool',label:'Borrow confirmed on-chain',fhe:[],gas:'-',en:false,event:'Confirm borrow on-chain'}]},
    ]},
  leverage:{name:'2x Leverage',desc:'Supply→Borrow→Swap→Re-supply',risk:'HIGH',gas:'835k',apy:'12.8%',
    phases:[
      {name:'Setup',steps:[{node:'User\nWallet',label:'Connect',fhe:[],gas:'-',en:false},{node:'FheForgeBase',label:'Permit',fhe:['Grant permission'],gas:'45k',en:false}]},
      {name:'Deploy',steps:[{node:'Composer',label:'Open position',fhe:[],gas:'30k',en:false},{node:'StrategyVault',label:'Open Vault',fhe:['Encrypt amount','Encrypted equality','Conditional select'],gas:'185k',en:true}]},
      {name:'Finance',steps:[{node:'LendingPool',label:'Supply',fhe:['Encrypted equality','Overflow check'],gas:'145k',en:true},{node:'PriceOracle',label:'Price',fhe:[],gas:'15k',en:false},{node:'LendingPool',label:'Borrow',fhe:['Multiply encrypted','Encrypted comparison','Conditional select'],gas:'210k',en:true}]},
      {name:'Swap',steps:[{node:'SwapRouter',label:'Swap',fhe:[],gas:'150k',en:false},{node:'LendingPool',label:'Re-supply',fhe:['Encrypted equality','Overflow check'],gas:'145k',en:true}]},
      {name:'Done',steps:[{node:'Composer',label:'Strategy deployed on-chain',fhe:[],gas:'-',en:false,event:'Strategy deployed on-chain'}]},
    ]},
  liquidate:{name:'Liquidate',desc:'Detect→Verify→Liquidate underwater position',risk:'LOW',gas:'320k',apy:'N/A',
    phases:[
      {name:'Detect',steps:[{node:'PriceOracle',label:'Price Check',fhe:[],gas:'15k',en:false},{node:'LendingPool',label:'Check liquidity',fhe:['Public reveal'],gas:'45k',en:true}]},
      {name:'Verify',steps:[{node:'CoFHE\nTaskManager',label:'Threshold Decrypt x2',fhe:['Threshold decrypt verify','Threshold decrypt verify'],gas:'200k',en:true}]},
      {name:'Execute',steps:[{node:'PriceOracle',label:'Oracle health check',fhe:[],gas:'15k',en:false},{node:'LendingPool',label:'Liquidate position',fhe:[],gas:'60k',en:false}]},
    ]},
  full:{name:'Full Lifecycle',desc:'Connect→Permit→Supply→Borrow→Repay→Withdraw',risk:'MODERATE',gas:'620k',apy:'N/A',

      {name:'Parallel Deposit',steps:[{node:'LendingPool',label:'Supply ETH',fhe:['Encrypted equality','Overflow check'],gas:'145k',en:true,parallel:true},{node:'LendingPool',label:'Supply USDC',fhe:['Encrypted equality','Overflow check'],gas:'145k',en:true,parallel:true}]},
      {name:'Borrow',steps:[{node:'PriceOracle',label:'Price',fhe:[],gas:'15k',en:false},{node:'LendingPool',label:'Borrow',fhe:['Multiply encrypted','Encrypted comparison','Conditional select'],gas:'210k',en:true}]},

// ──── SIM ENGINE ────
let simState='idle',simStrategy=null,simPhase=0,simStep=-1,simTimer=null,simParticles=[];
let showDetail=false,showEncrypted=true;
let autoRotateTimer=null,dirty2d=true,isPageVisible=true,lastTime=performance.now(),curveCache={};

const MAX_PARTICLES=20,particlePool=[];
class PartStream{
  constructor(sc,cv,cnt=30,cl=0xf59e0b){
    this.p=new Float32Array(cnt);this.sp=new Float32Array(cnt);this.pos=new Float32Array(cnt*3);this.cv=cv;
    for(let i=0;i<cnt;i++){this.p[i]=Math.random();this.sp[i]=.3+Math.random()*.5}
    this.geo=new THREE.BufferGeometry();this.geo.setAttribute('position',new THREE.BufferAttribute(this.pos,3));
    this.mat=new THREE.PointsMaterial({color:cl,size:.1,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false});
    this.mesh=new THREE.Points(this.geo,this.mat);sc.add(this.mesh);this.active=true;this.cnt=cnt;
  }
  reset(sc,cv,cnt,cl){
    this.cv=cv;this.active=true;this.mat.color.setHex(cl);this.mesh.visible=true;this.cnt=cnt;
    if(this.p.length!==cnt){this.p=new Float32Array(cnt);this.sp=new Float32Array(cnt);this.pos=new Float32Array(cnt*3);this.geo.setAttribute('position',new THREE.BufferAttribute(this.pos,3))}
    for(let i=0;i<cnt;i++){this.p[i]=Math.random();this.sp[i]=.3+Math.random()*.5;this.pos[i*3]=this.pos[i*3+1]=this.pos[i*3+2]=0}
    this.geo.attributes.position.needsUpdate=true;
  }
  deactivate(){this.active=false;this.mesh.visible=false}
  upd(dt){if(!this.active)return;for(let i=0;i<this.p.length;i++){this.p[i]+=dt*this.sp[i]*.4;if(this.p[i]>1)this.p[i]-=1;const pt=this.cv.getPoint(this.p[i]);this.pos[i*3]=pt.x;this.pos[i*3+1]=pt.y;this.pos[i*3+2]=pt.z}this.geo.attributes.position.needsUpdate=true}
  dispose(){scene.remove(this.mesh);this.mat.dispose();this.geo.dispose()}
}
function acquireParticle(sc,cv,cl){
  const ps=particlePool.pop();
  if(ps){ps.reset(sc,cv,25,cl);return ps}
  return new PartStream(sc,cv,25,cl);
}
function releaseParticle(ps){
  if(particlePool.length<MAX_PARTICLES){ps.deactivate();particlePool.push(ps)}
  else ps.dispose();
}

function getCurve(f,t){
  const key=f+'->'+t;
  if(curveCache[key])return curveCache[key];
  for(const c of curves)if(c.from===f&&c.to===t){curveCache[key]=c.curve;return c.curve}
  const fn=nodes[f],tn=nodes[t];if(!fn||!tn)return null;
  const s=fn.pos.clone(),e=tn.pos.clone();const mid=new THREE.Vector3().addVectors(s,e).multiplyScalar(.5);mid.y+=2;
  const pts=[];for(let k=0;k<=1;k+=.02){const p=new THREE.Vector3().lerpVectors(s,e,k);p.y+=Math.sin(k*Math.PI)*2;pts.push(p)}
  curveCache[key]=new THREE.CatmullRomCurve3(pts);
  return curveCache[key];
}
function hlNode(id,on=true){
  const n=nodes[id];if(!n||!n.b)return;
  n.b.material.emissiveIntensity=on?.8:.08;if(n.r)n.r.material.opacity=on?.4:.12;
}
function clearParts(){simParticles.forEach(p=>releaseParticle(p));simParticles=[]}
function clearHL(){C.forEach(c=>{const n=nodes[c.id];if(n&&n.b){n.b.material.emissiveIntensity=.08;if(n.r)n.r.material.opacity=.12}})}

function renderPhaseChips(){
  const bar=document.getElementById('phase-bar');
  if(!simStrategy){bar.innerHTML='<div style="padding:3px 10px;font-size:9px;color:#bbbec3">Select a strategy above to view phases</div>';return}
  bar.innerHTML=simStrategy.phases.map((p,i)=>`<div class="phase-chip ${i<simPhase?'done':i===simPhase?'active':'pending'}" data-idx="${i}" tabindex="0" role="button" aria-label="Phase ${i+1}: ${p.name}">${p.name}${i<simPhase?' <i class="done-mark">✓</i>':''}</div>`).join('');
}

function attachPhaseChips(){
  document.querySelectorAll('.phase-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const idx = parseInt(chip.dataset.idx);
      clearTimeout(simTimer);
      simState='idle';
      document.getElementById('play-btn').textContent='▶ Simulate';document.getElementById('play-btn').setAttribute('aria-pressed','false');
      runStep(idx, 0);
    });
  });
}

function updateDetail(phaseIdx,stepIdx){
  if(!showDetail||!simStrategy){document.getElementById('detail-panel').style.display='none';return}
  const p=simStrategy.phases[phaseIdx];if(!p||!p.steps[stepIdx])return;
  const s=p.steps[stepIdx];
  let html=`<div class="title">📋 ${TT(s.label)}</div><div class="row"><span class="label">Phase</span><span class="value">${TT(p.name)}</span></div>
    <div class="row"><span class="label">Contract</span><span class="value">${TT(s.node)}</span></div>
    <div class="row"><span class="label">Gas</span><span class="value"><span data-tt="Estimated gas cost in gas units">${s.gas}</span></span></div>
    <div class="row"><span class="label">Encrypted</span><span class="value">${s.en?'🔒 Yes':'🔓 No'}</span></div>`;
  if(s.event)html+=`<div class="row"><span class="label">Event</span><span class="value" style="color:#22c55e">${TT(s.event)}</span></div>`;
  if(s.fhe&&s.fhe.length){
    html+=`<div class="fhe-ops"><div class="title" style="font-size:9px;color:#f59e0b">⚡ FHE Operations</div>`;
    s.fhe.forEach(o=>{html+=`<div class="op">${TT(o)}<span class="gas">gas: ~120k (avg)</span></div>`});
    html+=`</div>`;
  }
  document.getElementById('detail-panel').innerHTML=html;document.getElementById('detail-panel').style.display='block';
}

function runStep(phaseIdx,stepIdx){
  if(!simStrategy||phaseIdx>=simStrategy.phases.length){
    simState='done';document.getElementById('play-btn').textContent='↺ Replay';document.getElementById('play-btn').setAttribute('aria-pressed','false');document.getElementById('reset-btn').disabled=false;
    document.getElementById('sim-status').innerHTML='✅ Complete';clearParts();clearHL();controls.autoRotate=true;renderPhaseChips();attachPhaseChips();dirty2d=true;document.getElementById('progress-fill').style.width='100%';updateBackBtn();
    document.getElementById('enc-indicator').textContent='✅ Complete';
    document.getElementById('enc-indicator').style.borderColor='#22c55e';
    document.getElementById('enc-indicator').style.color='#22c55e';return;
  }
  const p=simStrategy.phases[phaseIdx];
  if(stepIdx>=p.steps.length){runStep(phaseIdx+1,0);return}
  const s=p.steps[stepIdx];
  clearHL();clearParts();dirty2d=true;
  
  // Highlight phase
  simPhase=phaseIdx;simStep=stepIdx;renderPhaseChips();attachPhaseChips();updateBackBtn();

  // Highlight node
  hlNode(s.node,true);

  const fNode=nodes[s.node];
  if(fNode&&!s.isLoop){
    edges.forEach(e=>{if(e[0]===s.node||e[1]===s.node){const cv=getCurve(e[0],e[1]);if(cv)simParticles.push(acquireParticle(scene,cv,e[2]))}});
  }

  // FHE badge on sidebar
  const status=document.getElementById('sim-status');
  status.innerHTML=`${TT(p.name)}: ${TT(s.label)} ${s.fhe.length?`⚡ ${TT(s.fhe[0])}`:''}`;
  document.getElementById('enc-indicator').textContent=s.en?'🔒 Encrypted':'🔓 Not Encrypted';
  document.getElementById('enc-indicator').style.borderColor=s.en?'#f59e0b':'#9b9fa5';
  document.getElementById('enc-indicator').style.color=s.en?'#f59e0b':'#bbbec3';

  // Detail panel
  updateDetail(phaseIdx,stepIdx);

  // Parallel steps: highlight ALL nodes in this phase
  if(s.parallel){p.steps.forEach(st=>{if(st!==s)hlNode(st.node,true)});}

  controls.autoRotate=false;
  simState='running';
  const speed=parseFloat(document.getElementById('speed-slider').value);
  const dur=(s.isLoop?.5:1.5)/speed;
  simTimer=setTimeout(()=>runStep(phaseIdx,stepIdx+1),dur*1000);
  
  // Update progress bar
  let completedSteps=0;
  for(let i=0;i<phaseIdx;i++)completedSteps+=simStrategy.phases[i].steps.length;
  completedSteps+=stepIdx;
  const totalSteps=simStrategy.phases.reduce((a,p)=>a+p.steps.length,0);
  document.getElementById('progress-fill').style.width=(totalSteps>0?(completedSteps/totalSteps)*100:0)+'%';
  
  updateBackBtn();
}

const TT=(s)=>{const m={FHESafeMath128:'FHE Safe Math library for 128-bit encrypted integers',CoFHE:'Confidential FHE — off-chain compute network',euint128:'Encrypted unsigned integer (128-bit)',Permit:'Gasless token approval via EIP-2612 off-chain signature',encrypt:'Convert plaintext to encrypted FHE ciphertext',decrypt:'Convert FHE ciphertext back to plaintext',APY:'Annual Percentage Yield',LTV:'Loan-to-Value',TVL:'Total Value Locked',FHE:'Fully Homomorphic Encryption'};return s.replace(/FHESafeMath128|CoFHE|euint128|Permit|encrypt|decrypt|APY|LTV|TVL|FHE/g,t=>`<span data-tt="${m[t]}">${t}</span>`)}
// ──── UI ────
const list=document.getElementById('strategy-list');
Object.keys(STRATEGIES).forEach(k=>{
  const s=STRATEGIES[k];
  const div=document.createElement('div');div.className='item';
  const metaHtml=`${TT(s.risk)} · <span data-tt="Estimated gas cost in gas units">${s.gas}</span> · <span data-tt="Annual Percentage Yield">APY</span> ${s.apy}`;
  div.innerHTML=`<div class="name">${TT(s.name)}</div><div class="desc">${TT(s.desc)}</div><div class="meta">${metaHtml}</div>`;
  div.setAttribute('tabindex','0');
  div.setAttribute('role','button');
  div.setAttribute('aria-label',`Simulate ${s.name}: ${s.desc}`);
  div.onclick=()=>{
    document.querySelectorAll('.item').forEach(el=>el.classList.remove('active'));
    div.classList.add('active');
    clearTimeout(simTimer);simState='idle';clearParts();clearHL();dirty2d=true;
    simStrategy=s;simPhase=0;simStep=-1;
    renderPhaseChips();attachPhaseChips();
    updateBackBtn();
    document.getElementById('progress-fill').style.width='0%';
    document.getElementById('play-btn').textContent='▶ Simulate';document.getElementById('play-btn').setAttribute('aria-pressed','false');document.getElementById('reset-btn').disabled=false;
    document.getElementById('sim-status').innerHTML='Ready';
    document.getElementById('detail-panel').style.display='none';
    document.getElementById('enc-indicator').textContent='🔒 All Encrypted';
    document.getElementById('enc-indicator').style.borderColor='#f59e0b';
    document.getElementById('enc-indicator').style.color='#f59e0b';
    controls.autoRotate=true;
  };
  list.appendChild(div);
});

document.getElementById('play-btn').addEventListener('click',()=>{
  if(!simStrategy){document.querySelector('.item')?.click();return}
  if(simState==='running'){clearTimeout(simTimer);simState='paused';document.getElementById('play-btn').textContent='▶ Resume';document.getElementById('play-btn').setAttribute('aria-pressed','false');return}
  if(simState==='paused'){document.getElementById('play-btn').textContent='⏸ Pause';document.getElementById('play-btn').setAttribute('aria-pressed','true');simState='running';runStep(simPhase,simStep);return}
  simState='running';simPhase=0;simStep=0;
  clearParts();clearHL();controls.autoRotate=false;dirty2d=true;
  document.getElementById('play-btn').textContent='⏸ Pause';document.getElementById('play-btn').setAttribute('aria-pressed','true');
  document.getElementById('sim-status').innerHTML='▶ Starting...';
  runStep(0,0);
});

document.getElementById('reset-btn').addEventListener('click',()=>{
  clearTimeout(simTimer);simState='idle';simStrategy=null;simPhase=0;simStep=-1;
  clearParts();clearHL();dirty2d=true;document.getElementById('play-btn').textContent='▶ Simulate';document.getElementById('play-btn').setAttribute('aria-pressed','false');
  document.getElementById('reset-btn').disabled=true;
  updateBackBtn();
  document.getElementById('progress-fill').style.width='0%';
  document.getElementById('sim-status').innerHTML='Ready — <span class="live">●</span>';
  document.getElementById('detail-panel').style.display='none';document.getElementById('phase-bar').innerHTML='';
  document.querySelectorAll('.item').forEach(el=>el.classList.remove('active'));
  document.getElementById('enc-indicator').textContent='🔒 All Encrypted';
  document.getElementById('enc-indicator').style.borderColor='#f59e0b';
  document.getElementById('enc-indicator').style.color='#f59e0b';
  controls.autoRotate=true;
});

document.getElementById('reveal-btn').addEventListener('click',()=>{
  showDetail=!showDetail;
  document.getElementById('reveal-btn').textContent=showDetail?'🔍 Hide Details':'🔍 Show Details';
  if(!showDetail)document.getElementById('detail-panel').style.display='none';
});

function updateBackBtn(){
  const btn=document.getElementById('back-btn');
  btn.disabled=!(simStrategy&&!(simPhase===0&&simStep<=0));
}

document.getElementById('back-btn').addEventListener('click',()=>{
  clearTimeout(simTimer);
  let p=simPhase, s=simStep-1;
  if(s<0&&p>0){p--;s=simStrategy.phases[p].steps.length-1}
  if(p>=0)runStep(p,s);
});

document.getElementById('speed-slider').addEventListener('input',function(){
  document.getElementById('speed-label').textContent=this.value+'×';
});

// ──── 2D CANVAS ────
const can=document.getElementById('canvas2d');
const ctx=can.getContext('2d');
function resize2d(){can.width=can.parentElement.clientWidth;can.height=200;dirty2d=true;draw2d()}

function draw2d(){
  if(!simStrategy){ctx.fillStyle='#010202';ctx.fillRect(0,0,can.width,can.height);dirty2d=false;return}
  const w=can.width,h=can.height;
  ctx.fillStyle='#010202';ctx.fillRect(0,0,w,h);
  const phases=simStrategy.phases;
  const padL=80,padR=20,padT=40,padB=20;
  const stepW=(w-padL-padR)/Math.max(1,phases.reduce((a,p)=>a+p.steps.length,0));
  
  let x=padL;const y0=padT;
  phases.forEach((p,pi)=>{
    const totalW=p.steps.length*stepW;
    // Phase background
    ctx.fillStyle=`rgba(255,255,255,${pi===simPhase?.03:.015})`;
    ctx.fillRect(x,padT,totalW,h-padT-padB);
    // Phase label
    ctx.fillStyle=pi<simPhase?'#22c55e':pi===simPhase?'#2981fb':'#bbbec3';
    ctx.font='10px Courier New';ctx.fillText(p.name,x+4,y0-8);
    
    p.steps.forEach((s,si)=>{
      const sx=x+si*stepW;
      // Node arrow
      ctx.fillStyle=coreColors[s.node.split('\n')[0]]||0x7d8086;ctx.font='8px Courier New';
      ctx.fillText(s.node.replace('\n',' ').slice(0,12),sx+2,y0+12);
      // Step label
      ctx.fillStyle=pi<simPhase?'#22c55e':pi===simPhase?'#fff':'#bbbec3';
      ctx.font='9px Courier New';ctx.fillText(s.label.slice(0,16),sx+2,y0+28);
      // FHE ops
      if(s.fhe.length){
        ctx.fillStyle='#f59e0b';ctx.font='8px Courier New';
        ctx.fillText('⚡'+s.fhe[0].slice(0,14),sx+2,y0+42);
      }
      // Gas
      if(s.gas!=='-'){ctx.fillStyle='#bbbec3';ctx.font='8px Courier New';ctx.fillText(s.gas,sx+2,y0+54)}
      // Parallel indicator
      if(s.parallel){ctx.fillStyle='#2981fb';ctx.fillRect(sx,y0-2,stepW-2,2)}
      // Loop indicator
      if(s.isLoop){ctx.fillStyle='#a855f7';ctx.fillText('⟳ ×'+s.loopCount,sx+2,y0+66)}
    });
    x+=totalW;
  });
  
  // Timeline line
  ctx.strokeStyle='#44484d';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padL,y0-14);ctx.lineTo(w-padR,y0-14);ctx.stroke();
  
  if(simState==='running'||simState==='done'){
    const progX=padL+(w-padL-padR)*(simPhase/phases.length);
    ctx.fillStyle='#2981fb';ctx.fillRect(progX-1,y0-16,3,4);
  }
  
  // Legend
  ctx.fillStyle='#bbbec3';ctx.font='9px Courier New';
  ctx.fillText('← Timeline →',w/2-30,h-5);dirty2d=false;
}

window.addEventListener('resize',resize2d);
resize2d();

function resize3d(){
  if(!renderer||!labelRenderer||!camera)return;
  const vp=document.getElementById('viewport');
  const w=vp.clientWidth,h=vp.clientHeight;
  if(w===0||h===0)return;
  camera.aspect=w/h;camera.updateProjectionMatrix();
  renderer.setSize(w,h);labelRenderer.setSize(w,h);
}
window.addEventListener('resize',resize3d);
// Initial 3D resize after layout settles
setTimeout(resize3d,100);

// ──── VIEW SWITCH ────
let viewMode='3d';
document.getElementById('view2d-btn').addEventListener('click',()=>{
  document.getElementById('view3d-btn').classList.remove('active');document.getElementById('view2d-btn').classList.add('active');
  document.getElementById('viewport').style.display='none';document.getElementById('canvas2d').style.height='400px';resize2d();viewMode='2d';
});
document.getElementById('view3d-btn').addEventListener('click',()=>{
  document.getElementById('view2d-btn').classList.remove('active');document.getElementById('view3d-btn').classList.add('active');
  document.getElementById('viewport').style.display='block';document.getElementById('canvas2d').style.height='200px';viewMode='3d';
  setTimeout(resize3d,50);
});
    
    // ──── KEYBOARD SHORTCUTS ────
    document.addEventListener('keydown', e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
      switch(e.key){
        case ' ':
        case 'k':
          e.preventDefault();
          document.getElementById('play-btn').click();
          break;
        case 'ArrowRight':
        case 'n':
          // Skip to next step — find current step + advance
          if(simStrategy&&simPhase>=0){
            clearTimeout(simTimer);
            runStep(simPhase, simStep+1);
          }
          break;
        case 'ArrowLeft':
        case 'p':
          // Go back one step
          if(simStrategy&&(simStep>0||simPhase>0)){
            clearTimeout(simTimer);
            let p=simPhase, s=simStep-1;
            if(s<0){p--;s=simStrategy.phases[p].steps.length-1}
            runStep(p, s);
          }
          break;
        case 'r':
          e.preventDefault();
          document.getElementById('reset-btn').click();
          break;
        case 'd':
          document.getElementById('reveal-btn').click();
          break;
      }
    });

// ──── ANIMATION ────
let t=0;
function anim(){
  requestAnimationFrame(anim);
  const now=performance.now();
  const dt=Math.min((now-lastTime)/1000,.1);
  lastTime=now;
  if(renderer&&controls&&isPageVisible){
    t+=dt;
    meshes.forEach((m,i)=>{const s=1+Math.sin(t*2+i)*.015;m.scale.set(s,1,s);if(m.material&&m.material.emissiveIntensity<.3)m.material.emissiveIntensity=.08+Math.sin(t*3+i*1.5)*.06});
    curves.forEach((c,i)=>{if(c.mesh.material)c.mesh.material.opacity=.3+Math.sin(t*1.5+i*.5)*.12});
    simParticles.forEach(p=>p.upd(dt));
    controls.update();renderer.render(scene,camera);labelRenderer.render(scene,camera);
  }
  if(viewMode==='2d'&&simState==='running'&&dirty2d){draw2d();dirty2d=false}
}
anim();
document.addEventListener('visibilitychange',()=>{
  isPageVisible=!document.hidden;
  if(document.hidden&&simState==='running'){clearTimeout(simTimer);simState='paused';document.getElementById('play-btn').textContent='▶ Resume';document.getElementById('play-btn').setAttribute('aria-pressed','false')}
  lastTime=performance.now();
});

// Click on 2D canvas to jump to phase
can.addEventListener('click',e=>{
  if(!simStrategy)return;
  const rect=can.getBoundingClientRect();const mx=e.clientX-rect.left;
  const phases=simStrategy.phases;const padL=80;const stepW=(can.width-padL-20)/Math.max(1,phases.reduce((a,p)=>a+p.steps.length,1));
  let x=padL;
  for(let i=0;i<phases.length;i++){
    const w=phases[i].steps.length*stepW;
    if(mx>=x&&mx<x+w){clearTimeout(simTimer);runStep(i,0);break}
    x+=w;
  }
});
