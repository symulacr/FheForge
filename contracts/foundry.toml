[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test-foundry"
solc_version = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@fhenixprotocol/=node_modules/@fhenixprotocol/",
    "forge-std/=lib/forge-std/src/",
]
auto_detect_remappings = false
