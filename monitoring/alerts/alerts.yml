---
# Alert Rules for FheForge
#
# MC-061: Removed 11 rules that referenced non-existent metrics.
# MC-062: Restored 4 API rules after MC-024 (/metrics endpoint) confirmed
#         metric names: http_requests_total, http_request_duration_seconds,
#         user_signups_total (all with method/status/path labels).

groups:
  # ── API alerts (require MC-024 /metrics endpoint) ──────────────────
  - name: api_alerts
    interval: 30s
    rules:
      # High Error Rate (>5% of requests returning 5xx over 5m)
      - alert: HighErrorRate
        expr: |
          (
            rate(http_requests_total{status=~"5.."}[5m]) /
            rate(http_requests_total[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: backend-api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"

      # Slow API Response (p95 > 1s over 5m)
      - alert: SlowAPIResponse
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 1
        for: 5m
        labels:
          severity: warning
          service: backend-api
        annotations:
          summary: "Slow API response time"
          description: "95th percentile response time is {{ $value }}s"

      # API Down (Prometheus target unreachable for >1m)
      - alert: APIDown
        expr: up{job="backend-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: backend-api
        annotations:
          summary: "API is down"
          description: "Backend API has been down for more than 1 minute"

      # New User Sign-up (informational)
      - alert: NewUserSignup
        expr: increase(user_signups_total[5m]) > 0
        labels:
          severity: info
          service: business
        annotations:
          summary: "New user sign-up"
          description: "{{ $value }} new user(s) signed up in the last 5 minutes"

  # ── System alerts (require node_exporter on Docker host) ──────────
  - name: system_alerts
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes{fstype!="tmpfs"} - node_filesystem_free_bytes{fstype!="tmpfs"}) / node_filesystem_size_bytes{fstype!="tmpfs"} * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High disk usage"
          description: "Disk usage is {{ $value }}% on {{ $labels.instance }}"
