# ============================================================
# Nightly Integration Tests
#
# Runs the full forge-test.ts suite against live Arbitrum Sepolia
# every night at midnight UTC. Also supports manual trigger.
#
# The forge-test.ts script exercises ALL 9 FheForge contracts
# on-chain: StrategyRegistry, StrategyVault, LendingPool,
# SwapRouter, PriceOracle, FheForgeComposer, ExecutorContract,
# TokenRegistry, StrategyExecutor.
#
# NOTE: The hardhat config uses network name "arb-sepolia"
# (chainId 421614). This workflow maps secrets accordingly.
# ============================================================
name: Nightly Integration Tests

on:
  schedule:
    # Daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      network:
        description: "Target network (arb-sepolia or base-sepolia)"
        required: true
        default: "arb-sepolia"
        type: choice
        options:
          - arb-sepolia
          - base-sepolia

env:
  FORGE_COVERAGE_MIN: 50

jobs:
  nightly-integration:
    name: Nightly Integration (forge-test.ts)
    runs-on: ubuntu-latest
    environment: arb-sepolia
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "nightly"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            contracts/node_modules
            ~/.cache/bun
            ~/.foundry/cache
          key: nightly-${{ runner.os }}-bun-${{ hashFiles('contracts/bun.lock', 'contracts/package-lock.json') }}
          restore-keys: |
            nightly-${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install
        working-directory: contracts

      - name: Hardhat compile
        run: HARDHAT_EXPERIMENTAL_ALLOW_NON_LOCAL_INSTALLATION=true node node_modules/.bin/hardhat compile
        working-directory: contracts

      - name: Forge build
        run: forge build
        working-directory: contracts

      - name: Run integration tests
        id: forge_test
        working-directory: contracts
        env:
          ARBITRUM_SEPOLIA_RPC_URL: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL || secrets.ARBITRUM_SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.TESTER_PRIVATE_KEY }}
          TESTER_PRIVATE_KEY: ${{ secrets.TESTER_PRIVATE_KEY }}
        run: |
          NETWORK="${{ github.event.inputs.network || 'arb-sepolia' }}"
          echo "Running forge-test.ts on network: $NETWORK"
          HARDHAT_EXPERIMENTAL_ALLOW_NON_LOCAL_INSTALLATION=true \
            npx hardhat run scripts/forge-test.ts \
            --network "$NETWORK" \
            2>&1 | tee test-logs.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-logs
          path: contracts/test-logs.txt
          retention-days: 30

